name: Update streak stats
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
concurrency:
  group: streak-stats
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=0D1117&stroke=1E2D4A&ring=00D9FF&fire=F97316&currStreakLabel=00D9FF&sideLabels=94A3B8&dates=475569&sideNums=FFFFFF
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}
      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update streak stats"
          git push origin HEAD:main
